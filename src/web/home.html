<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint bot</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }

        .cell {
            background: #fff;
            border: 1px solid #ddd;
            min-height: 220px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        select {
            width: 100%;
            padding: 6px;
        }

        .feed-preview {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #ccc;
            background: #fafafa;
            color: #666;
            text-align: center;
            overflow: hidden;
        }

        .feed-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="grid">
        {% for cell in cells %}
        <section class="cell">
            <form method="post" action="{{ url_for('set_feed_route') }}">
                <input type="hidden" name="slot" value="{{ cell.slot }}">
                <div class="controls">
                    <label for="{{ cell.slot }}">{{ cell.slot.replace('_', ' ') }}</label>
                    <select id="{{ cell.slot }}" name="feed" onchange="this.form.submit()">
                        {% for feed in feed_types %}
                        <option value="{{ feed.name }}" {% if feed == cell.feed %}selected{% endif %}>
                            {{ feed.name.replace('_', ' ') }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </form>

            <div class="feed-preview">
                {% if cell.has_image %}
                <img
                    data-slot="{{ cell.slot }}"
                    data-src="{{ url_for('feed_image_route', slot=cell.slot) }}"
                    src="{{ url_for('feed_image_route', slot=cell.slot) }}?v={{ cell.version }}"
                    alt="{{ cell.feed.name }}"
                >
                {% else %}
                {{ cell.feed.name.replace('_', ' ') }}
                {% endif %}
            </div>
        </section>
        {% endfor %}
    </main>

    <script>
        setInterval(() => {
            document.querySelectorAll("img[data-slot]").forEach((img) => {
                img.src = img.dataset.src + "?t=" + Date.now();
            });
        }, 1000);
    </script>
</body>
</html>
