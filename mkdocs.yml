site_name: Paint Robot
site_description: A Python-based research and implementation project for paint robot control and optimization
site_author: Simon
site_url: https://SimonMeersschaut.github.io/paint-bot/

theme:
  name: readthedocs
  palette:
    - scheme: default
      primary: blue
      accent: orange
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex
  - pymdownx.details
  - pymdownx.tasklist
  - attr_list
  - tables
  - admonition
  - toc

nav:
  - Home: index.md
  - License: license.md
  - Stroke Generation Algorithm:
    - Overview: stroke_algorithm/overview.md
    - Depth Estimation: stroke_algorithm/depth_estimation.md
    - Segmentation: stroke_algorithm/segmentation.md
    - Expanding: stroke_algorithm/stroke_expanding.md
    - Supervisor: stroke_algorithm/stroke_generation_supervisor.md
  - Hardware Control:
    - Overview: hardware/overview.md
  - API Reference:
    - Datatypes: api/datatypes.md
    - StrokeSequence: api/strokesequence.md
    - StrokePath: api/strokepath.md
    - RobotCalibration: api/calibration.md
  

docs_dir: docs
site_dir: site
